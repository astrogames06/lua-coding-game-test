<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>web lua</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/midnight.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/lua/lua.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <textarea id="editor">-- Game Code :)

function _init()
end

function _update()
end

function _draw()
end</textarea>
            <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        </div>
        <div class="bottom-container">
            <button id="run-btn"><img src="icons/play.svg" alt="play"></button>

            <div class="output-wrapper">
                <h1><img src="icons/terminal.svg" alt="terminal">Terminal</h1>
                <textarea id="output" rows="20" cols="80" readonly></textarea>
            </div>
        </div>
        <script>
            window.CodeEditor = CodeMirror.fromTextArea($('#editor')[0], {
                mode: "lua",
                lineNumbers: true,
                theme: "midnight",
                tabSize: 4
            });

            let saved_code = localStorage.getItem("code");
            if (saved_code)
            {
                window.CodeEditor.setValue(JSON.parse(saved_code));
            }

            window.CodeEditor.on("change", function(cm) {
                localStorage.setItem("code", JSON.stringify(window.CodeEditor.getValue().toString()));
                console.log(cm.getValue());
            });

            window.Module = {
                onRuntimeInitialized: function () {
                    
                    let run_btn = $('#run-btn');
                    let run_btn_icon = run_btn.find('img');

                    run_btn.on('click', function() {
                        Module.cpp_run_lua_code(window.CodeEditor.getValue().toString());
                        Module.cpp_set_lua_game_loop();

                        if (!Module.cpp_lua_is_running())
                        {
                            // run_btn.textContent = "Run";
                            run_btn_icon.attr('src', "icons/play.svg");
                            Module.cpp_restart_game();
                        }
                        else
                        {
                            // run_btn.textContent = "Stop!";
                            run_btn_icon.attr('src', "icons/stop.svg");
                        }
                    });

                    
                },
                print: (function() {
                    var element = document.getElementById('output');
                    if (element) element.value = ''; // clear browser cache
                    return function(text) {
                        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                        console.log(text);
                        if (element) {
                          element.value += text + "\n";
                          element.scrollTop = element.scrollHeight; // focus on bottom
                        }
                    };
                })(),
                canvas: (function() {
                    var canvas = document.getElementById('canvas');
                    return canvas;
                })(),
            };
        </script>
        <script src="index.js"></script>
    </body>
</html>
